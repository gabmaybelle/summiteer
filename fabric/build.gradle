plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"summiteer" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Tall-terrain runs: `./gradlew :fabric:runClientGameTest -PtestTectonic` (or -PtestTerralith)
	// plays the in-game test with that mod installed, fetched from Modrinth's maven by version id.
	// Nothing here is bundled or required.
	// Both terrain mods need the Lithostitched worldgen library.
	if (project.hasProperty("testTectonic") || project.hasProperty("testTerralith")) {
		runtimeOnly "maven.modrinth:lithostitched:${project.lithostitched_fabric_version}"
	}
	if (project.hasProperty("testTectonic")) {
		runtimeOnly "maven.modrinth:tectonic:${project.tectonic_fabric_version}"
	}
	if (project.hasProperty("testTerralith")) {
		runtimeOnly "maven.modrinth:terralith:${project.terralith_fabric_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "summiteer_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
