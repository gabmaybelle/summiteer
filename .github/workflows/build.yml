# Builds both jars on every push and pull request, then runs the in-game tests on a virtual
# display (fabric/src/gametest and neoforge/src/clienttest), on their own and with each tall-terrain
# mod, so a broken build, a crash in game or a clash with Tectonic or Terralith shows up straight
# away. The built jars are attached to each run under "Artifacts", and the screenshots alongside.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'on its own'
            test_args: ''
          - variant: 'with Tectonic'
            test_args: '-PtestTectonic'
          - variant: 'with Terralith'
            test_args: '-PtestTerralith'
    name: build (${{ matrix.variant }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: run game test
        # 26.3 asks for an sRGB-capable window, which Xvfb's GLX can't give, so the game would
        # hang at startup. Mesa's EGL can; SDL uses it with this set.
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest ${{ matrix.test_args }}
      - name: run NeoForge game test
        # The same checks on the NeoForge jar. A failed check crashes the game, which fails this
        # step; the crash report is uploaded below.
        if: always()
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :neoforge:runClientTest ${{ matrix.test_args }}
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.variant }})
          path: |
            fabric/build/run/clientGameTest/screenshots/
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        if: matrix.variant == 'on its own'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
