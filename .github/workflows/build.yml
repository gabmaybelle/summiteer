# Builds both jars for Minecraft 1.21.1 on every push and pull request, then runs the in-game tests on a virtual
# display (fabric/src/gametest and neoforge/src/clienttest), on their own and with each tall-terrain
# mod, so a broken build, a crash in game or a clash with Tectonic or Terralith shows up straight
# away. The built jars are attached to each run under "Artifacts", and the screenshots alongside.
# A push or pull request that only changes notes (Markdown), the art sources in art/ or the licence
# is skipped: none of those end up in the jar. Anything else, the textures and icon included, runs.

name: build
on:
  push:
    paths-ignore: ['**.md', 'art/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'art/**', 'LICENSE']

# A newer push to the same branch stops the run it replaces: only the newest code needs testing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'on its own'
            test_args: ''
          - variant: 'with Tectonic'
            test_args: '-PtestTectonic'
          - variant: 'with Terralith'
            test_args: '-PtestTerralith'
    name: build (Minecraft 1.21.1, ${{ matrix.variant }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # The code is compiled for Java 21 (1.21.1's) by this newer JDK.
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: run game test
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest ${{ matrix.test_args }}
      - name: run NeoForge game test
        # The same checks on the NeoForge jar. A failed check crashes the game, which fails this
        # step; the crash report is uploaded below.
        if: always()
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :neoforge:runClientTest ${{ matrix.test_args }}
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.variant }})
          path: |
            fabric/build/run/clientGameTest/screenshots/
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        if: matrix.variant == 'on its own'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
